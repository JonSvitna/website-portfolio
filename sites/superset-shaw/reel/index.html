<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f1eb;
      }

      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #f5f1eb;
      }

      .scroll-strip {
        position: relative;
        width: 1920px;
        will-change: transform;
      }

      .scroll-segment {
        width: 1920px;
        overflow: hidden;
      }

      .scroll-segment--hero {
        height: 1080px;
      }

      .scroll-segment--hero img {
        display: block;
        width: 1920px;
        height: 1080px;
      }

      .scroll-segment--continued {
        height: 998px;
      }

      .scroll-segment--continued img {
        display: block;
        width: 1920px;
        height: 1080px;
        margin-top: -82px;
      }

      .scroll-segment + .scroll-segment {
        margin-top: -324px;
      }

      .site-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 82px;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        background-color: rgba(245, 241, 235, 0.96);
        background-image: url("capture/screenshots/scroll-000.png");
        background-repeat: no-repeat;
        background-size: 1920px auto;
        background-position: top center;
        border-bottom: 1px solid #d9d3cb;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="davion-thomas-reel"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene1" class="scene">
        <div class="viewport">
          <div class="scroll-strip" data-layout-allow-overflow>
            <div class="scroll-segment scroll-segment--hero">
              <img
                src="capture/screenshots/scroll-000.png"
                alt="Davion Thomas hero"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-011.png"
                alt="Davion Thomas story"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-022.png"
                alt="Davion Thomas pillars"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-033.png"
                alt="Davion Thomas transformations"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-044.png"
                alt="Davion Thomas services"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-055.png"
                alt="Davion Thomas feed"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-067.png"
                alt="Davion Thomas community"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-078.png"
                alt="Davion Thomas CTA"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-089.png"
                alt="Davion Thomas apply"
                crossorigin="anonymous"
              />
            </div>
            <div class="scroll-segment scroll-segment--continued">
              <img
                src="capture/screenshots/scroll-100.png"
                alt="Davion Thomas footer"
                crossorigin="anonymous"
              />
            </div>
          </div>

          <div class="site-header" data-layout-ignore aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const frameHeight = 1080;
      const heroHeight = 1080;
      const continuedHeight = 998;
      const segmentOverlap = 324;
      const continuedCount = 9;
      const stripHeight =
        heroHeight + continuedCount * (continuedHeight - segmentOverlap);
      const scrollDistance = Math.max(0, stripHeight - frameHeight);

      tl.from(
        ".scroll-segment--hero img",
        { opacity: 0, duration: 0.8, ease: "power2.out" },
        0.2,
      );
      tl.to(
        ".scroll-strip",
        { y: -scrollDistance, duration: 16, ease: "power1.inOut" },
        2,
      );
      tl.to(
        ".site-header",
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        2,
      );

      window.__timelines["davion-thomas-reel"] = tl;
    </script>
  </body>
</html>
